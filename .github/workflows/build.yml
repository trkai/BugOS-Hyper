name: BugOS ROM Build

on:
  workflow_dispatch:
    inputs:
      input_url:
        description: 'URL'
        required: true

jobs:
  Initialize:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      BUILDER_NAME: "iabi"
      BUILDER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
    steps:
      - name: Free runner space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/share/swift /opt/microsoft /usr/local/.ghcup \
                      /usr/lib/mono /opt/az
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          df -h /

      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          swap-size-mb: 1024
          root-reserve-mb: 6144
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Checkout repository
        uses: actions/checkout@main

      - name: Show disk space
        run: |
          df -h
          df -h "$GITHUB_WORKSPACE"
          lsblk -o NAME,SIZE,TYPE,MOUNTPOINT

      - name: Set up Time
        run: |
          echo "Setting Vietnam timezone"
          sudo timedatectl set-timezone Asia/Ho_Chi_Minh

      - name: Install OpenJDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Stuff
        run: |
          sudo bash setup.sh

      - name: Giving permission
        run: |
          sudo chmod 777 -R *

      - name: Build prop-fix helper
        run: |
          set -e
          SRC="bin/package/BugOSPropFix/bugos_propfix.c"
          OUT="bin/package/BugOSPropFix/bugos_propfix"
          if [ ! -f "$SRC" ]; then
            echo "Không có $SRC - bỏ qua"
            exit 0
          fi

          # Không dùng NDK: zip r27c giải nén ~5GB, runner hết đĩa giữa lúc unzip
          # (ENOSPC trong liblldb.so) và chết cả job. Binary chỉ cần libc chuẩn,
          # nên cross-gcc của Ubuntu (~120MB) là đủ và không phụ thuộc bionic.
          #
          # Phải kèm libc6-dev-arm64-cross: nếu thiếu, gcc không thấy sysroot
          # arm64 và lấy nhầm /usr/include của host -> "bits/libc-header-start.h:
          # No such file". `--no-install-recommends` KHÔNG cài kèm gói này.
          CC=aarch64-linux-gnu-gcc
          if ! command -v "$CC" >/dev/null 2>&1; then
            echo "Cài cross-compiler aarch64 ..."
            sudo apt-get update -qq
            sudo apt-get install -y -qq \
              gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          fi
          "$CC" --version | head -1
          echo "sysroot: $(aarch64-linux-gnu-gcc -print-sysroot)"

          # Tự kiểm tra phần ghi serial bằng gcc của máy build TRƯỚC khi đóng
          # binary vào ROM. Đây là chỗ từng sai mà không báo lỗi: serial giữ
          # byte độ dài cũ -> bionic đọc lại value sai độ dài.
          gcc -O1 -Wall -DBUGOS_SELFTEST -o /tmp/propfix_selftest "$SRC"
          /tmp/propfix_selftest --selftest

          # -static + -no-pie: ELF tĩnh không cần loader động, chạy được trên
          # Android (kernel Linux, không đụng bionic).
          "$CC" -Os -Wall -fno-stack-protector -static -no-pie -s -o "$OUT" "$SRC"
          file "$OUT"
          ls -la "$OUT"

      - name: Build ROM...
        timeout-minutes: 90
        env:
          INPUT_URL: ${{ inputs.input_url }}
        run: |
          sudo -E bash build.sh "$INPUT_URL" "${{ github.repository }}" "xiaomi" "${{ env.BUILDER_NAME }}" "${{ env.BUILDER_ID }}"

      - name: Check Kaorios SELinux block
        run: |
          set -e
          CIL="build/baserom/images/system/system/etc/selinux/plat_sepolicy.cil"
          if [ ! -f "$CIL" ]; then
            echo "Không thấy $CIL - bỏ qua"
            exit 0
          fi

          # Không biên dịch được cả file: policy của ROM dùng permissionx kind
          # "nlmsg" (app_neverallows.te:151) mà secilc 3.5 của Ubuntu không
          # biết, nên nó chết ở dòng 16237 - trước cả khối của mình. Repo
          # Ubuntu này không có secilc mới hơn.
          #
          # Nên kiểm bằng script: đúng những lỗi đã làm brick máy (05/11) -
          # '#' thay vì ';', ngoặc lệch, type/attribute/role/class không tồn tại.
          python3 bin/tools/check_cil_block.py "$CIL"

      - name: Pack ROM...
        timeout-minutes: 40
        run: |
          sudo bash packROM.sh

      - name: Upload ROM...
        run: |
          sudo -E bash uploadROM.sh

      - name: Upload ROM to Google Drive
        id: drive
        if: success()
        continue-on-error: true
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
          GDRIVE_DIR: ${{ secrets.GDRIVE_DIR }}
        run: |
          if [ -z "$RCLONE_CONF" ]; then
            echo "Chưa cấu hình RCLONE_CONF -> bỏ qua Google Drive"
            exit 1
          fi

          ROM_ZIP_PATH="out/$(cat bin/ddevice/output_zip.txt)"
          if [ ! -f "$ROM_ZIP_PATH" ]; then
            echo "Không thấy file ROM: $ROM_ZIP_PATH"
            exit 1
          fi

          DEST="${GDRIVE_DIR:-gdrive:BugOS}"
          mkdir -p "$HOME/.config/rclone"
          printf '%s\n' "$RCLONE_CONF" > "$HOME/.config/rclone/rclone.conf"

          echo "Upload lên Google Drive: $DEST"
          rclone copy "$ROM_ZIP_PATH" "$DEST" --drive-chunk-size 256M --retries 3 --low-level-retries 10 --stats 30s --stats-one-line

          LINK=$(rclone link "$DEST/$(basename "$ROM_ZIP_PATH")" 2>/dev/null || true)
          if [ -z "$LINK" ]; then
            echo "Upload xong nhưng không tạo được link chia sẻ"
            exit 1
          fi

          echo "Download link (Drive): $LINK"
          echo "DOWNLOAD_LINK=$LINK" >> "$GITHUB_ENV"

      - name: Upload ROM to Gofile.io
        if: success() && steps.drive.outcome != 'success'
        continue-on-error: true
        env:
          GOFILE_TOKEN: ${{ secrets.GOFILE_TOKEN }}
        run: |
          set +e
          ROM_ZIP_PATH="out/$(cat bin/ddevice/output_zip.txt)"
          if [ ! -f "$ROM_ZIP_PATH" ]; then
            echo "Không thấy file ROM: $ROM_ZIP_PATH"
            exit 1
          fi

          df -h /
          free -h

          # Gofile: lấy store server rồi mới upload (endpoint upload.gofile.io đã bỏ)
          SERVER=$(curl -fsS --max-time 60 https://api.gofile.io/servers | jq -r '.data.servers[0].name')
          if [ -z "$SERVER" ] || [ "$SERVER" = "null" ]; then
            echo "Không lấy được Gofile server"
            exit 1
          fi
          echo "Gofile server: $SERVER"

          AUTH=()
          if [ -n "$GOFILE_TOKEN" ]; then
            AUTH=(-F "token=${GOFILE_TOKEN}")
          fi

          LINK=""
          for i in 1 2 3; do
            RES=$(curl -sS --max-time 3600 "${AUTH[@]}" \
                  -F "file=@${ROM_ZIP_PATH}" "https://${SERVER}.gofile.io/contents/uploadfile") || RES=""
            echo "Lần $i: status=$(echo "$RES" | jq -r '.status' 2>/dev/null)"
            LINK=$(echo "$RES" | jq -r '.data.downloadPage // empty' 2>/dev/null)
            if [ -n "$LINK" ]; then
              break
            fi
            sleep 10
          done

          if [ -z "$LINK" ]; then
            echo "Upload Gofile thất bại"
            exit 1
          fi

          echo "Upload thành công! Link tải: $LINK"
          echo "DOWNLOAD_LINK=$LINK" >> "$GITHUB_ENV"

      - name: Success Notification
        if: success()
        run: |
          pip install requests
          python notify.py success "${{ github.repository }}" "${{ inputs.input_url }}" "xiaomi" "${{ env.BUILDER_NAME }}" "${{ env.BUILDER_ID }}"

      - name: Failure Notification
        if: failure()
        run: |
          pip install requests
          python notify.py fail "${{ github.repository }}" "${{ inputs.input_url }}" "xiaomi" "${{ env.BUILDER_NAME }}" "${{ env.BUILDER_ID }}"

      - name: Cleanup
        if: always()
        run: |
          sudo rm -rf out build
