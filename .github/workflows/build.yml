name: BugOS ROM Build

on:
  workflow_dispatch:
    inputs:
      input_url:
        description: 'URL'
        required: true

jobs:
  Initialize:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      BUILDER_NAME: "iabi"
      BUILDER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
    steps:
      - name: Free runner space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/share/swift /opt/microsoft /usr/local/.ghcup \
                      /usr/lib/mono /opt/az
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          df -h /

      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          swap-size-mb: 1024
          root-reserve-mb: 6144
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Checkout repository
        uses: actions/checkout@main

      - name: Show disk space
        run: |
          df -h
          df -h "$GITHUB_WORKSPACE"
          lsblk -o NAME,SIZE,TYPE,MOUNTPOINT

      - name: Set up Time
        run: |
          echo "Setting Vietnam timezone"
          sudo timedatectl set-timezone Asia/Ho_Chi_Minh

      - name: Install OpenJDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Stuff
        run: |
          sudo bash setup.sh

      - name: Giving permission
        run: |
          sudo chmod 777 -R *

      - name: Build ROM...
        timeout-minutes: 90
        env:
          INPUT_URL: ${{ inputs.input_url }}
        run: |
          sudo -E bash build.sh "$INPUT_URL"

      - name: Pack ROM...
        timeout-minutes: 40
        run: |
          sudo bash packROM.sh

      - name: Upload ROM...
        run: |
          sudo -E bash uploadROM.sh

      - name: Free build disk before upload
        if: success()
        run: |
          # uploadROM.sh da chiem xong out/ va ghi output_zip.txt; build/ khong
          # con ai dung. De nguyen no lam root fs day 100% (log that: 718M/145G)
          # -> rclone/Gofile de hong o nam cuoi cung.
          echo "Truoc don: $(df -h / | tail -1)"
          sudo rm -rf build
          echo "Sau don:  $(df -h / | tail -1)"

      - name: Upload ROM to Google Drive
        id: drive
        if: success()
        continue-on-error: true
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
          GDRIVE_DIR: ${{ secrets.GDRIVE_DIR }}
        run: |
          if [ -z "$RCLONE_CONF" ]; then
            echo "Chưa cấu hình RCLONE_CONF -> bỏ qua Google Drive"
            # exit 1 co chu: keep outcome=failure de step Gofile (outcome != success) chay.
            exit 1
          fi

          ROM_ZIP_PATH="out/$(cat bin/ddevice/output_zip.txt)"
          if [ ! -f "$ROM_ZIP_PATH" ]; then
            echo "Không thấy file ROM: $ROM_ZIP_PATH"
            exit 1
          fi

          DEST="${GDRIVE_DIR:-gdrive:BugOS}"

          # setup.sh co `sudo apt install rclone` NHUNG khong co set -e: neu apt
          # hong giua chung (PPA / het dia) step van xanh va day moi phat hien o day.
          if ! command -v rclone >/dev/null 2>&1; then
            echo "rclone khong co trong PATH -> tu cai lai"
            sudo apt-get update -qq || true
            sudo apt-get install -y -qq rclone || {
              echo "Khong cai duoc rclone -> nhuong cho Gofile"
              exit 1
            }
          fi
          rclone version | head -n 1

          mkdir -p "$HOME/.config/rclone"
          printf '%s\n' "$RCLONE_CONF" > "$HOME/.config/rclone/rclone.conf"

          echo "Upload lên Google Drive: $DEST"
          rclone copy "$ROM_ZIP_PATH" "$DEST" --drive-chunk-size 256M --retries 3 --low-level-retries 10 --stats 30s --stats-one-line

          LINK=$(rclone link "$DEST/$(basename "$ROM_ZIP_PATH")" 2>/dev/null || true)
          if [ -z "$LINK" ]; then
            echo "Upload xong nhưng không tạo được link chia sẻ"
            exit 1
          fi

          echo "Download link (Drive): $LINK"
          echo "DOWNLOAD_LINK=$LINK" >> "$GITHUB_ENV"

      - name: Upload ROM to Gofile.io
        if: success() && steps.drive.outcome != 'success'
        continue-on-error: true
        env:
          GOFILE_TOKEN: ${{ secrets.GOFILE_TOKEN }}
        run: |
          set +e
          ROM_ZIP_PATH="out/$(cat bin/ddevice/output_zip.txt)"
          if [ ! -f "$ROM_ZIP_PATH" ]; then
            echo "Không thấy file ROM: $ROM_ZIP_PATH"
            exit 1
          fi

          df -h /
          free -h

          # Gofile: lấy store server rồi mới upload (endpoint upload.gofile.io đã bỏ)
          SERVER=$(curl -fsS --max-time 60 https://api.gofile.io/servers | jq -r '.data.servers[0].name')
          if [ -z "$SERVER" ] || [ "$SERVER" = "null" ]; then
            echo "Không lấy được Gofile server"
            exit 1
          fi
          echo "Gofile server: $SERVER"

          # Co token thi thu token truoc. Neu Gofile tra `error-token` (secret sai
          # hoac het han) thi BO TOKEN va upload an danh - cung cach cac build cu
          # (trước khi co GOFILE_TOKEN) van upload thanh cong.
          MODE=token
          [ -z "$GOFILE_TOKEN" ] && MODE=anon

          LINK=""
          for i in 1 2 3 4; do
            AUTH=()
            [ "$MODE" = "token" ] && AUTH=(-F "token=${GOFILE_TOKEN}")

            RES=$(curl -sS --max-time 3600 "${AUTH[@]}" \
                  -F "file=@${ROM_ZIP_PATH}" "https://${SERVER}.gofile.io/contents/uploadfile") || RES=""
            STATUS=$(printf '%s' "$RES" | jq -r '.status // empty' 2>/dev/null)
            LINK=$(printf '%s' "$RES" | jq -r '.data.downloadPage // empty' 2>/dev/null)
            echo "Lần $i (mode=$MODE): status=${STATUS:-curl-error}"

            [ -n "$LINK" ] && break

            if [ "$STATUS" = "error-token" ] && [ "$MODE" = "token" ]; then
              echo "GOFILE_TOKEN bị Gofile từ chối -> đổi sang upload ẩn danh"
              MODE=anon
              continue
            fi
            [ -n "$STATUS" ] && echo "  response: $(printf '%s' "$RES" | head -c 300)"
            sleep 10
          done

          if [ -z "$LINK" ]; then
            echo "Upload Gofile thất bại"
            exit 1
          fi

          echo "Upload thành công! Link tải: $LINK"
          echo "DOWNLOAD_LINK=$LINK" >> "$GITHUB_ENV"

      - name: Success Notification
        if: success()
        continue-on-error: true
        run: |
          pip install requests
          python notify.py success "${{ github.repository }}" "${{ inputs.input_url }}" "xiaomi" "${{ env.BUILDER_NAME }}" "${{ env.BUILDER_ID }}"

      - name: Failure Notification
        if: failure()
        continue-on-error: true
        run: |
          pip install requests
          python notify.py fail "${{ github.repository }}" "${{ inputs.input_url }}" "xiaomi" "${{ env.BUILDER_NAME }}" "${{ env.BUILDER_ID }}"

      - name: Cleanup
        if: always()
        run: |
          sudo rm -rf out build
